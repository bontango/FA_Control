# FA_Control naming file -- Flash Gordon on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 125 of SD image v098 ('SternFA SD - latest List.xlsx': FLASHGORDON / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Flash_Gordon
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Flash Gordon

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=4 Drop Target Reset
2=3 Drop Target Reset
3=Inline Drop Target Reset
4=Saucer Kick Down
6=Knocker
7=Outhole Kicker
8=Saucer Kick Up
9=Single Drop Target Reset
10=Thumper Bumper Left
11=Thumper Bumper Right
12=Single Drop Target Pull Down
13=Thumper Bumper Top
14=Left Slingshot
15=Right Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Left & Right Rollover Button (2)
1=Shooter Lane Rollover Button (3)
2=Top Single Drop Target
3=Shooter Lane Rollover
4=Drop Target 50 Point Rebound (2)
5=Credit Button
6=Tilt (3)
7=Outhole

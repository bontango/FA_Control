# FA_Control naming file -- Freedom on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 096 of SD image v098 ('SternFA SD - latest List.xlsx': FREEDOM / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Freedom
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Freedom

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Chime 10
2=Chime 100
3=Chime 1000
4=Chime Extra
6=Knocker
7=Outhole Kicker
8=Top Hole (Scores Wheel Value)
9=Top Thumper Bumper
10=Right Thumper Bumper
11=Bottom Thumper Bumper
12=Left Slingshot
13=Drop Target Reset
14=Saucer (scores Wheel Value)
15=Right Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Drop Target 1 (Bottom)
1=Drop Target 2
2=Drop Target 3
3=Drop Target 4
4=Drop Target 5 (Top)
5=Credit Button
6=Tilt (3)
7=Outhole
8=Coin Chute III (Right)
9=Coin Chute I (Left)
10=Coin Chute II (Middle)
15=Slam (2)
17=Left & Right Outlane
18=Score 100 Points (General Purpose)
19=Score 10 Points (General Purpose)
20=Wheel Rollover
21=Advance Bonus & Flipper Feeder Lanes
22=Spinner
23=Collect Wheel Value Saucers
27=Right Slingshot
28=Bottom Thumper Bumper
29=Right Thumper Bumper
30=Top Thumper Bumper
31=Left Slingshot

[lamps]
# FA-Nummer = Adresse + 15 * Datenbit (U1..U4) laut AS-2518-23
0=Bonus 1K
1=Bonus 5K
2=Bonus 9K
3=Wheel 1 (Double Bonus)
4=Wheel 5 (Lite Spin)
5=Wheel 9 (Advance Bonus 3)
10=Same Player Shoot Again (Back Box) / Same Player Shoot Again (Playfield)
12=Ball-in-Play
13=Can Play 1
14=1st Player Up
15=Bonus 2K
16=Bonus 6K
17=Bonus 10K
18=Wheel 2 (5K)
19=Wheel 6 (500)
20=Wheel 10 (5K)
21=Thumper Bumper (Bottom)
23=Spinners 1000 Points
25=Match
27=High Score to Date
28=Can Play 2
29=2nd Player Up
30=Bonus 3K
31=Bonus 7K
33=Wheel 3 (Advance Bonus 3)
34=Wheel 7 (Double Bonus)
35=Double Bonus
36=Thumper Bumper (Right)
38=Spinners 100 Points
42=Game Over
43=Can Play 3
44=3rd Player Up
45=Bonus 4K
46=Bonus 8K
47=Special
48=Wheel 4 (500)
49=Wheel 8 (500)
50=Credit Indicator
51=Thumper Bumper (Top)
53=Switched Bumper ???
57=Tilt
58=Can Play 4
59=4th Player Up

[displays]
# LISY-Konvention: 0 = Status/Credit, 1..4 = Spieler 1..4.
0=Credits / Ball
1=Player 1
2=Player 2
3=Player 3
4=Player 4

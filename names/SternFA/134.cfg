# FA_Control naming file -- Mr. & Mrs. Pacman on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 134 of SD image v098 ('SternFA SD - latest List.xlsx': MR_MRSPACMAN / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Mr._%26_Mrs._Pacman
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Mr. & Mrs. Pacman

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Top Left Saucer, Kick Left
2=Top Left Saucer, Kick Right
3=Right Saucer
6=Knocker
7=Outhole
8=Left 4-Bank Drop Target #1
9=Left Thumper Bumper / Left 4-Bank Drop Target #2
10=Right Thumper Bumper / Left 4-Bank Drop Target #3
11=Left Slingshot / Left 4-Bank Drop Target #4
12=Right Slingshot / Right 4-Bank Drop Target #1

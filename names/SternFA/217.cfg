# FA_Control naming file -- Stingray on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 217 of SD image v098 ('SternFA SD - latest List.xlsx': Stingray / Stern)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Stingray
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Stingray

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Chime 10
2=Chime 100
3=Chime 1,000
4=Extra Chime (10,000)
6=Knocker
7=Outhole Kicker
9=Saucers (2)
10=Drop Targets Reset
11=Left Bumper
12=Top Bumper
13=Right Bumper
14=Right Slingshot
15=Left Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
5=Credit Button
6=Tilt
7=Outhole
8=Coin Chute III (Right)
9=Coin Chute II (Center)
10=Coin Chute I (Left)
11=Ball Kickout (2)
13=Advance Bonus Rollover
15=Slam (3)
20=10 Points Rebound (2)
21=Left & Right 50 Points
22=Left Inlane
23=Right Inlane
24=Drop Target A
25=Drop Target B
26=Drop Target C
27=Drop Target D
28=Drop Target E
29=Spinner, 5 Rollovers, 2 Targets
30=Left Outlane
31=Right Outlane
35=Right Slingshot
36=Left Slingshot
37=Right Bumper
38=Top Bumper
39=Left Bumper

[lamps]

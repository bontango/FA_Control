14=1st Player Up
15=Bonus 20K
16=Bonus 60K
17=Bonus 100K
18=Extra Ball Lane Right
19=Extra Ball Lane Left
23=Score 55,000
25=Match
27=Highest Score
28=Player #2
29=2nd Player Up
30=Bonus 30K
31=Bonus 70K
33=Bumper Left & Top
34=Bumper Right
35=Target Down Lights Special
38=Ligths Double Bonus When Lit
41=Double Bonus
42=Game Over
43=Player #3
44=3rd Player Up
45=Bonus 40K
46=Bonus 80K
48=Special Right Outlane

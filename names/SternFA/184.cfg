# FA_Control naming file -- Spectrum (Freeplay) on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 184 of SD image v098 ('SternFA SD - latest List.xlsx': SPECTRUM / Bally Freeplay)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Spectrum
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Spectrum (Freeplay)

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Top Saucer Kick to Left
2=Top Saucer Kick to Right
3=Left Side Middle Saucer
4=Right Side Middle Saucer
5=Outhole
6=Knocker
8=Left Side Bottom Saucer
9=Right Side Bottom Saucer
10=Blue Drop Target Reset
11=Green Drop Target Reset
12=Yellow Drop Target Reset
13=Red Drop Target Reset
17=Coin Lockout
18=Flipper enabling relay

[switches]

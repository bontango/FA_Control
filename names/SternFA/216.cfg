15=Bonus 2K
16=Bonus 6K
17=Bonus 10K
18=Extra Ball Lane Left
19=Extra Ball Lane Right
23=Score 50,000 When Lit
25=Match
26=Top Saucer Light
27=Highest Score
28=Player #2
29=2nd Player Up
30=Bonus 3K
31=Bonus 7K
33=Bumper Left
34=Bumper Right
35=Target Down Lights Special

# FA_Control naming file -- Pinball on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 216 of SD image v098 ('SternFA SD - latest List.xlsx': Pinball / Stern)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Pinball
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Pinball

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Chime 10
2=Chime 100
3=Chime 1,000
4=Chime 10,000
5=Right Drop Targets Reset
6=Knocker
7=Outhole Kicker
8=Top Saucer
9=Right Saucer
10=Left Drop Targets Reset
11=Left Bumper
12=Right Bumper
13=Bottom Bumper
14=Right Slingshot
15=Left Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
5=Credit Button
6=Tilt (3)
7=Outhole
8=Coin Chute III (Right)
9=Coin Chute II (Center)
10=Coin Chute I (Left)
11=Right Saucer
12=Top Saucer
13=Advance Bonus Rollovers (4)
15=Slam (2)
20=10 Points Rebound (4)
21=Left & Right 50 Points
22=Right Side Inlane
23=Left Side Inlane
24=Drop Target A
25=Drop Target B
26=Drop Target C
27=Drop Target D
28=Drop Target E
29=Spinner
30=Right Outlane
31=Left Outlane
35=Right Slingshot
36=Left Slingshot
37=Bottom Bumper
38=Right Bumper
39=Left Bumper

[lamps]

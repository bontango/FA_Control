# FA_Control naming file -- Spy Hunter (Freeplay) on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 189 of SD image v098 ('SternFA SD - latest List.xlsx': SPYHUNTER / Bally Freeplay)

# FA_Control naming file -- Centaur (Freeplay) on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 180 of SD image v098 ('SternFA SD - latest List.xlsx': CENTAUR / Bally Freeplay)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Centaur
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Centaur (Freeplay)

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=ORBS Drop Target Reset
2=Right Drop Target #1 (Top)
3=Right Drop Target #2
4=Right Drop Target #3
5=Right Drop Target #4 (bot.)
6=Knocker
7=Outhole
8=Inline Drop Target Reset

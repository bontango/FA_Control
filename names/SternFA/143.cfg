# FA_Control naming file -- Black Pyramid on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 143 of SD image v098 ('SternFA SD - latest List.xlsx': BLACKPYRAMID / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Black_Pyramid
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Black Pyramid

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
8=Left Slingshot
9=Right Slingshot
10=Left Thumper Bumper
11=Right Thumper Bumper
12=Saucer
13=Drop Target Reset
14=Outhole
15=Knocker
16=Gate
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Left Slingshot
1=Right Slingshot
2=Left Thumper Bumper
3=Right Thumper Bumper
4=Swinger Target
5=Credit Button
6=Saucer
7=Outhole
8=Coin Chute III (Right)
9=Coin Chute I (Left)
10=Coin Chute II (Middle)
11=30 Points Rebound (2)
12=Top Left Rollover Button
13=Top Right Rollover Button
14=Tilt (3)
15=Slam (2)
16=Top Left Bumper Lane
17="P" Target
18="Y" Target
19="R" Target
20="A" Target
21="M" Target
22="I" Target

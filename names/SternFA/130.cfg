# FA_Control naming file -- Medusa on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 130 of SD image v098 ('SternFA SD - latest List.xlsx': MEDUSA / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Medusa
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Medusa

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Knocker / Open Movable Flipper
2=4-Bank Drop Target Reset / Close Movable Flipper
3=7-Bank Drop Target Reset / Top Drop Target #1
4=Top Drop Target #2 / Top Drop Target #3
5=Top Drop Target #4 / Top Drop Target #5
6=Top Drop Target #6 / Top Drop Target #7
7=Shield of the Gods Post
8=Outhole / Saucer
9=Bottom Left Thumper Bumper
10=Bottom Right Thumper Bumper
11=Top Left Thumper Bumper
12=Top Right Thumper Bumper
13=Left Slingshot
14=Bottom Right Slingshot
15=Top Right Slingshot
17=Coin Lockout
18=Flipper enabling relay


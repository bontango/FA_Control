# FA_Control naming file -- Kings of Steel (Freeplay) on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 190 of SD image v098 ('SternFA SD - latest List.xlsx': KINGSOFSTEEL / Bally Freeplay)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Kings_of_Steel
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Kings of Steel (Freeplay)

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Right Thumper Bumper
2=Left Thumper Bumper
3=Bottom Thumper Bumper
5=Right Slingshot
6=Knocker
7=Outhole
8=Drop Target #1 "Q" (top)

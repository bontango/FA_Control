# FA_Control naming file -- Fathom (Special) on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 214 of SD image v098 ('SternFA SD - latest List.xlsx': FATHOM / Special)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Fathom
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Fathom (Special)

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=3 Top Drop Target Reset / 1st Green Inline Drop Target
2=6 Drop Target Reset / 2nd Green Inline Drop Target
3=3 Middle Drop Target Reset / 3rd Green Inline Drop Target
4=Right Inline Drop Target Reset
6=Knocker
7=Outhole
8=Left Thumper Bumper
9=Bottom Thumper Bumper
10=Right Thumper Bumper
11=Left Slingshot
12=Right Slingshot
13=Top Saucer / 1st Blue Inline Drop Target
14=Right Saucer / 2nd Blue Inline Drop Target
15=3rd Blue Inline Drop Target
17=Coin Lockout
18=Flipper enabling relay


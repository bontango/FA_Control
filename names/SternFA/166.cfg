# FA_Control naming file -- Space Invaders (Freeplay) on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 166 of SD image v098 ('SternFA SD - latest List.xlsx': SPACEINVADERS / Bally Freeplay)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Space_Invaders
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Space Invaders (Freeplay)

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
6=Knocker
7=Outhole Kicker
8=3-Bank Drop Target Reset
9=Single Drop Target Reset
11=Left Thumper Bumper
12=Right Thumper Bumper
13=Bottom Thumper Bumper
14=Left Slingshot
15=Right Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Drop Target #3 (Bottom)
1=Drop Target #2
2=Drop Target #1 (Top)
3=Spinner
4=50 Point Rebound (4), Drop Target, Top Bumpers (4)
5=Credit Button
6=Tilt (3)

# FA_Control naming file -- Cybernaut on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 145 of SD image v098 ('SternFA SD - latest List.xlsx': CYBERNAUT / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Cybernaut
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Cybernaut

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
9=Saucer
10=Drop Target Reset
11=Thumper Bumper
12=Left Slingshot
13=Right Slingshot
14=Outhole
15=Knocker
16=Left Gate
17=Coin Lockout
18=Flipper enabling relay
19=Right Gate

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Thumper Bumper
1=Left Slingshot
2=Right Slingshot
3=Right Outlane
4=Saucer
5=Credit Button
6=Rebound

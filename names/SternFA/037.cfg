1=Top Drop Target Bank Reset
2=Right Drop Target Bank Reset
3=Left Target Bank Reset
4=Outhole
5=Multiball Holder / Ball Trap
6=Knocker
9=Drop Target "O" 1st
10=Drop Target "R" 1st
11=Drop Target "B"
12=Drop Target "I"
13=Drop Target "T"
14=Drop Target "O" 2nd
15=Drop Target "R" 2nd
18=Flipper enabling relay
19=Rotor Wheel Enable Relay


18=Left & Right Return lanes
19=Upper Rollover Button (Center)
20=Stand-Up Target #1 (Right)
21=Stand-Up Target #2 (Right)
22=Stand-Up Target #1 (Left), Upper Rollover (Right)
23=Stand-Up Target #2 (Left)
25=Saucer
26=10 Points & Change (2)
27=Drop Target #3
28=Drop Target #3
29=Drop Target #2
30=Drop Target #1
31=Drop Target #1
32=Outhole
38=Left Outlane
39=Center Rollover Button


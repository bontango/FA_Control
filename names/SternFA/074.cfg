# FA_Control naming file -- Magic on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 074 of SD image v098 ('SternFA SD - latest List.xlsx': Magic / Stern)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Magic
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Magic

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Right Thumper
2=Left Thumper
3=Center Thumper
6=Knocker
7=Left Slingshot
10=Right Slingshot
13=Eject Pocket
14=3-Bank Drop Target Reset
15=Outhole
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Coin Chute III (Right)
1=Coin Chute II (Center)
2=Coin Chute I (Left)
4=Rollover Button
5=Credit Button
6=Tilt
7=Slam (3)
9=Lower Rollover Button

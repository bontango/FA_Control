# FA_Control naming file -- Hot Hand on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 073 of SD image v098 ('SternFA SD - latest List.xlsx': Hot Hand / Stern)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Hot_Hand
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Hot Hand

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
6=Knocker
8=Center Thumper
9=5-Bank Drop Target Reset
10=Right Thumper
11=Eject Pocket
12=Left Thumper
13=Right Slingshot
14=Left Slingshot
15=Outhole
17=Coin Lockout
18=Flipper enabling relay
19=Relay for Rotating Flipper

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Coin Chute III (Right)
1=Coin Chute I (Center)
2=Coin Chute II (Left)
4=Rollover Button
5=Credit Button
6=Tilt
7=Slam (3)
8=Right Return Lane, Top Left Target
9=Left Return Lane
10=Spin Target
11=Right Thumper
12=Center Thumper
13=Left Slingshot
14=Right Slingshot
15=Left Thumper
16=Right Outlane
17=Left Outlane
18=Rebound Switches (2)
19=Stand-Up Target "K"
20=Stand-Up Target "J"
22=Stand-Up Target "10"
23=Stand-Up Target "Q"
27=Drop Target "K"
28=Drop Target "J"
29=Drop Target "A"
30=Drop Target "10"
31=Drop Target "Q"
32=Outhole
33=Eject Pocket
35=Ball Pockets "K" (2)
36=Ball Pockets "J" (2)
38=Ball Pockets "10" (4)
39=Ball Pockets "Q" (2)


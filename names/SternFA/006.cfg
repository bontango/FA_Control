# FA_Control naming file -- Quicksilver on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 006 of SD image v098 ('SternFA SD - latest List.xlsx': Quicksilver / Stern MPU-200)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Quicksilver
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Quicksilver

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Right Thumper Bumper
2=Left Thumper Bumper
3=Lower Thumper Bumper
4=Left Slingshot
5=Right Slingshot
6=Knocker
7=Center Drop Target Reset
8=Right Drop Target Reset
9=Kick-Out Hole
10=Outhole
17=Coin Lockout
18=Flipper enabling relay

[switches]

# FA_Control naming file -- Vector (Freeplay) on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 182 of SD image v098 ('SternFA SD - latest List.xlsx': VECTOR / Bally Freeplay)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Vector
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Vector (Freeplay)

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=X-Y-Z Drop Target Reset
2=3 Lower Drop Target Reset
3=Left Bottom Saucer
4=3 Top Drop Target Reset
5=Right Bottom Saucer
6=Knocker
7=Outhole / 3 Top Drop Target (Left)
8=3 Top Drop Target (Middle)
9=Captive Ball #1 Kick Up / 3 Top Drop Target (Right)
10=Captive Ball #1 Kick Down / 3 Lower Drop Target (Left)
11=Captive Ball #2 / 3 Lower Drop Target (Middle)
12=Captive Ball #3 / 3 Lower Drop Target (Right)
13=Thumper Bumper
14=Left Slingshot
15=Right Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]

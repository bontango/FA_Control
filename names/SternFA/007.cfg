# FA_Control naming file -- Stargazer on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 007 of SD image v098 ('SternFA SD - latest List.xlsx': Stargazer / Stern MPU-200)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Stargazer
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Stargazer

# [lamps] von PinWiki verworfen: dort wortgleich von einem anderen Spiel kopiert.
# [coils] von PinWiki verworfen: dort wortgleich von einem anderen Spiel kopiert.

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
# ergaenzt (nicht von PinWiki): 3, 4, 6, 7, 12, 18 -- Quelle s. EXTRA im Generator
3=Center Drop Target Reset
4=Right Drop Target Reset
6=Knocker
7=Left Drop Target Reset
12=Ball Release
18=Flipper Enable Relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Coin Chute I (Left)
1=Coin Chute II (Center)
2=Coin Chute III (Right)
3=Spin Target (Left)
4=Spin Target (Right)
5=Credit Button
6=Tilt
7=Slam (3)
8=Center Spin Target
9=Gemini Stand-Up Target
10=Cancer Stand-Up Target
11=Left Thumper
12=Right Thumper
13=Center Thumper
14=Right Slingshot
15=Left Slingshot
16=Leo Stand-Up Target
17=Virgo Stand-Up Target
18=Libra Stand-Up Target
19=Scorpio Stand-Up Target
20=Sagittarius Stand-Up Target
21=Left Drop Target (Bottom)
22=Left Drop Target (Middle)
23=Left Drop Target (Top)
24=Center Drop Target (Left)
25=Center Drop Target (Middle)
26=Center Drop Target (Right)
27=Right Drop Target (Top)
28=Right Drop Target (Middle)
29=Right Drop Target (Bottom)
30=Capricorn Stand-Up Target
31=Aquarius Stand-Up Target
32=Outhole
33=Right Outlane
34=Left Outlane
35=Right Rollover Button
36=Left Rollover Button
37=Pices Stand-Up Target
38=Aries Stand-Up Target
39=Taurus Stand-Up Target

[displays]
# LISY-Konvention: 0 = Status/Credit, 1..4 = Spieler 1..4.
0=Credits / Ball
1=Player 1
2=Player 2
3=Player 3
4=Player 4

# FA_Control naming file -- Lectronamo on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 229 of SD image v098 ('SternFA SD - latest List.xlsx': Lectronamo / Stern)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Lectronamo
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Lectronamo

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Sound 100
2=Sound 10
3=Sound 1.000
4=Sound 10.000
5=3-Bank Drop Target Reset
6=Knocker
7=Outhole
8=Center Saucer
9=Lane Kicker
10=5-Bank Drop Target Reset
11=Left Thumper
12=Right Slingshot
13=Center Thumper
14=Right Thumper
15=Left Slingshot
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Right Outlane
1=Right Return Lane
2=Left Outlane
3=Left Return Lane
4=Drop Target #1 (5-Bank)
5=Credit Button
6=Tilt
7=Outhole
8=Coin Chute III (Right)
9=Coin Chute I (Center)
10=Coin Chute II (Left)
11=Target (Stand-Up)
12=Drop Target #2 (5-Bank)
13=Drop Target #1 (3-Bank)
14=Spin-Target
15=Slam (3)
16=Rollover Button
17=300 Advance Bonus (3)
18=10 Points (3)
20=Drop Target #3 (5-Bank)
21=Drop Target #2 (3-Bank)
23=Kicker
24=1000 Advance Bonus
28=Drop Target #4 (5-Bank)
29=Drop Target #3 (3-Bank)
32=Center Thumper
33=Right Thumper
34=Left Thumper
36=Drop Target #5 (5-Bank)
37=Right Slingshot
38=Left Slingshot
39=Center Saucer

[lamps]
# FA-Nummer = Adresse + 15 * Datenbit (U1..U4) laut AS-2518-23
0=Bonus 1K
1=Bonus 5K
2=Bonus 9K
3=Advance Bonus #1
6=Extra Ball
7=Spinner
8=5-Bank Target Special
9=Bonus Multiplier 2X
10=Shoot Again
12=Ball-in-Play
13=Player #1
14=1st Player Up
15=Bonus 2K
16=Bonus 6K
17=Bonus 10K
18=Advance Bonus #2
22=Saucer
23=Rollover Button
24=Bonus Multiplier 3X
25=Match
27=Highest Score
28=Player #2
29=2nd Player Up
30=Bonus 3K
31=Bonus 7K
33=Advance Bonus #3
38=Left Return
39=Bonus Multiplier 5X
40=Drop Target 2X
42=Game Over
43=Player #3
44=3rd Player Up
45=Bonus 4K
46=Bonus 8K
48=Advance Bonus #4
53=Drop Target 5X
54=Extra Ball Lane
55=Drop Target 3X
57=Tilt
58=Player #4
59=4th Player Up

[displays]
# LISY-Konvention: 0 = Status/Credit, 1..4 = Spieler 1..4.
0=Credits / Ball
1=Player 1
2=Player 2
3=Player 3
4=Player 4

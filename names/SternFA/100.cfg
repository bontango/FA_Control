8=Coin Chute III (Right)
9=Coin Chute I (Left)
10=Coin Chute II (Middle)
15=Slam (2)
16=Right Drop Target D (Bottom)
17=Right Drop Target C
18=Right Drop Target B
19=Right Drop Target A (Top)
20=Left Drop Target D (Bottom)
21=Left Drop Target C
22=Left Drop Target B
23=Left Drop Target A (Top)
24=Down Post Rollover Button
25=Center Rollover Button
26=Right Outlane
27=Left Outlane
28=Right Rollover Button (Top)
29=Left Rollover Button (Top)
31=Top Hole Saucer
32=Top Rollover Button & Center Target
33=Right Rollover Button Lane (Center)
34=Left Rollover Button Lane (Center)
35=Right Slingshot
36=Left Slingshot
37=Bottom Thumper Bumper
38=Right Thumper Bumper
39=Left Thumper Bumper


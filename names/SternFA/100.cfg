# FA_Control naming file -- Power Play on SternFA
#
# ERZEUGT von FPGA Stern\roms\gen_names_FA_Control.py -- nicht von Hand aendern.
# SternFA slot 100 of SD image v098 ('SternFA SD - latest List.xlsx': POWERPLAY / Bally)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/Power_Play
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=Power Play

[coils]
# FA-Nummer = Treiber Qn laut AS-2518-16 (1..15 momentan, 16..19 dauernd)
1=Down Post
2=Chime 10
3=Chime 100
4=Chime 1000
5=Chime Extra
6=Knocker
7=Outhole kicker
8=Top Hole Saucer
9=Left Thumper Bumper
10=Right Thumper Bumper
11=Bottom Thumper Bumper
12=Left Slingshot
13=Drop Target Reset Left
14=Right Slingshot
15=Drop Target Reset Right
16=Up Post
17=Coin Lockout
18=Flipper enabling relay

[switches]
# FA-Nummer = Strobe * 8 + Return = Handbuch-/PinWiki-Nummer - 1
0=Left & Right Flipper Feeder Lanes
1=50 Points Rebound
2=10 Point Drop Target Rebound (2)
3=Right Rollover Button (Bottom)
4=Left Rollover Button (Bottom)
5=Credit Button
6=Tilt (3)

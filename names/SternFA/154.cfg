# FA_Control naming file -- The Six Million Dollar Man (Freeplay) on SternFA
#
# ERZEUGT von names/tools/gen_sternfa_names.py -- nicht von Hand aendern.
# SternFA slot 154 of SD image v098 ('SternFA SD - latest List.xlsx': 6MILLIONMAN / Bally Freeplay)
#
# Namen: PinWiki https://www.pinwiki.com/wiki/index.php/The_Six_Million_Dollar_Man
# Umrechnung: Schaltplaene AS-2518-23 (Lampen) und AS-2518-16 (Spulen), s. Generator.
# PinWiki 'Sol. No' ist KEINE Spulennummer -- gelesen wird die Treiberspalte Qn.
# See names/example.cfg for the format. Kein Kommentar hinter dem Wert.

[game]
name=The Six Million Dollar Man (Freeplay)

[coils]

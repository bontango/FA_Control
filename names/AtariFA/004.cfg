[lamps]
# FA-Control-Nummer = (595-Gruppe - 1) * 4 + Strobe   (Strobe SA=0 .. SD=3)
# Die Zuordnung Steckerpin J1/J2 -> FA-Nummer ist SPIELUNABHAENGIG -- AtariFA hat
# genau ein Lampen-Layout fuer alle fuenf Spiele. Sie steht als fertige Tabelle in
# FPGA_source/docs/FA_Control_Names_Files.md Abschnitt 4 (erzeugt aus GRP_OF in
# rtl/common/lamp_map_pkg.vhd, gegen die 62 Airborne-Lampen der 002.cfg geprueft).
# Aus dem Lampenblatt dieses Spiels wurde deshalb nur "Pin -> Funktion" gelesen.
# Pin 1 und Pin A jedes Steckers tragen die Beleuchtung und sind nicht in der Matrix.
# Zwei unabhaengige Quellen, die sich decken:
#   1. Steckerblatt J1/J2 aus Manuals/Space Riders/Atari Space Riders manual.pdf
#      Seite 58 (Figure 5-7, Interconnect and Wiring Diagram, Sheet 2 of 2)
#      -- liefert Pin -> Funktion, also Gruppe UND Strobe.
#   2. doc/Lamp_Latches_Space_Rider.png (Handbuch Table 5-6, LATCH TEST (LAMPS))
#      -- liefert Latch-Adresse + Datenbit, also nur die 595-Gruppe. Fuer den
#      Strobe reicht das nicht: in teilweise belegten Gruppen ist nicht
#      entscheidbar, welcher der vier Plaetze leer ist.
# Die Gegenprobe ist aufgegangen: in jeder der 14 Gruppen stehen die Namen der
# Latch-Tabelle in aufsteigender Strobe-Reihenfolge genau auf den Plaetzen, die
# das Steckerblatt belegt. Zusaetzlich liegen alle zwoelf Bonus-Lampen auf
# Strobe SD, der BIKE-Spellout auf SC, der CITY-Spellout auf SA.
# EINE Lampe stammt allein aus der Latch-Tabelle: Nummer 70 (Gruppe 18, Strobe SC,
# $1004 D3) = "Ball". Das Steckerblatt laesst J2-7 leer; die drei uebrigen Plaetze
# der Gruppe sind vom Blatt bestaetigt, also bleibt fuer "Ball" nur dieser.
# Wo die beiden Quellen im Wortlaut abweichen, gilt das Steckerblatt: es nennt
# 49/53/56/72 "Lt./Rt. Lower/Upper Center Rollover", die Latch-Tabelle dagegen
# "Upper Left/Right Rollover"; 20 heisst dort "Top Left Rollover".
# 52 der 84 Lampen sind belegt. Nicht belegt: 0-3, 32-47, 54, 58, 62, 74, 76-83

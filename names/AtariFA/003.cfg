[lamps]
# FA-Control-Nummer = (595-Gruppe - 1) * 4 + Strobe   (Strobe SA=0 .. SD=3)
# Die Zuordnung Steckerpin J1/J2 -> FA-Nummer ist SPIELUNABHAENGIG -- AtariFA hat
# genau ein Lampen-Layout fuer alle fuenf Spiele. Sie steht als fertige Tabelle in
# FPGA_source/docs/FA_Control_Names_Files.md Abschnitt 4 (erzeugt aus GRP_OF in
# rtl/common/lamp_map_pkg.vhd, gegen die 62 Airborne-Lampen der 002.cfg geprueft).
# Aus dem Lampenblatt dieses Spiels wurde deshalb nur "Pin -> Funktion" gelesen.
# Pin 1 und Pin A jedes Steckers tragen die Beleuchtung und sind nicht in der Matrix.
# Quelle: doc/Lamp_Strobes_Middle_Earth_1.png (J1) und _2.png (J2); beide
# Ausschnitte aus Manuals/Middle Earth/Middle_Earth_TM-108_1st_Printing_Sheet_1_of_2.pdf
# (13600x8809 px), aus dem die zweifelhaften Stellen nachgelesen wurden.
# WICHTIG: auf J1 ist Pin B unbelegt -- das Blatt beschriftet die Zeilen
# A, C, D, E, F, ... und ueberspringt B ohne Leerzeile. Bei J2 ist B dagegen
# belegt (Player #3). Die Buchstaben wurden dafuer einzeln vergroessert verglichen.
# Gegenprobe ueber die Strobes (die DS-Nummern folgen hier NICHT der Pin-
# Reihenfolge, taugen also nicht): alle elf Bonus-Lampen 1K..20K liegen auf
# Strobe SD, alle vier Spieler-Lampen auf SC, Tilt/Match/Ball Number/Same Player
# Shoots Again auf SA. Mit Pin B als belegt gerechnet faellt das komplett
# auseinander -- das ist der Beleg fuer die Zuordnung.
# Zwei Lampen tragen auf dem Blatt denselben Namen: Left Upper Rollover (57/61,
# DS17 und DS18) und Same Player Shoots Again (8/12) -- je zwei Birnen.
# DS59 kommt auf diesem Blatt nicht vor (vermutlich Ruecken/Blatt 2).
# 49 der 84 Lampen sind belegt. Nicht belegt: 0-3, 20, 32-47, 64, 66, 68-71, 76-83

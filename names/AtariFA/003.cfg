[switches]
# FA-Control-Nummer = CPU-Offset (Adresse - 0x2000), 0-basiert.
# Das ist die Leitungs- und Schluesselnummer. FA Control BESCHRIFTET die
# Schalterkacheln bei AtariFA aber mit der Selbsttest-Nummer (= FA-Nummer - 15),
# 0-15 als D0-D15; die Leitungsnummer steht im Tooltip ("41 (wire 56)").
# Umrechnung aus der Manual-Nummer:  FA-Nummer = Manual-Nummer + 15
# Quelle: "Atari Schalterzuordnungen und Kontakttestcodes.csv", Spalte
# "Middle Earth" (Steckerpin J7/J10 + CPU-Adresse). Unbelegt und deshalb hier
# nicht aufgefuehrt: 34 und 35 ($2022/$2023, in der Quelle "---").
# 76-79 = Hex-Decode-Schalter (Replay-Stufen, $204C-$204F).
# Gegenprobe: der Outhole liegt auf $2038 = 56, so wie im FPGA-Top-Level
# (AtariFA.vhd, Trigger der Hintergrundmusik) hinterlegt.
#
# 0-15 sind KEINE Spielfeldschalter, sondern die beiden 8er-Programmier-DIP-
# Baenke der MPU (PROG SW1 und PROG SW2). Reihenfolge wie bei allen Gen1-
# Spielen (Memory Map Table 5-6, Gegenprobe PinMAME dipg1_r):
#   0-3   $2000-$2003 = PROG SW2 Toggle 4, 3, 2, 1
#   4-7   $2004-$2007 = PROG SW2 Toggle 8, 7, 6, 5
#   8-11  $2008-$200B = PROG SW1 Toggle 4, 3, 2, 1
#   12-15 $200C-$200F = PROG SW1 Toggle 8, 7, 6, 5
# Die Funktionen in Klammern stammen aus
# Manuals/Middle Earth/Atari_Inc_1978_Middle_Earth_Switch_Settings.txt.
# Ohne Klammer = das Blatt nennt diesen Toggle nicht (SW1-3 und SW1-8).
# Schalter 11 traegt im Original zugleich den Testschalter (dieselbe
# Dekoder-Leitung $200B wie PROG SW1 Toggle 1).

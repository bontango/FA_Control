[lamps]
# FA-Control-Nummer = (595-Gruppe - 1) * 4 + Strobe   (Strobe SA=0 .. SD=3)
# Hergeleitet aus Sheet 18D: jeder Ausgang traegt dort das Label
# "LAMP <RAM>-B<bit>-S<strobe>"; RAM-Offset = Latch*4 + Strobe, und
# Gruppe = GRP_OF(Latch*6 + bit) aus rtl/common/lamp_map_pkg.vhd.
# Airborne belegt J1 komplett und J2 nur teilweise -> 62 der 84 Lampen.
# Nicht belegt: 0-3, 7, 24, 32-35, 39-47, 51, 78, 82.

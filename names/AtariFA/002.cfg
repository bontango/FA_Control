[switches]
# FA-Control-Nummer = CPU-Offset (Adresse - 0x2000), 0-basiert.
# Das ist die Leitungs- und Schluesselnummer. FA Control BESCHRIFTET die
# Schalterkacheln bei AtariFA aber mit der Selbsttest-Nummer (= FA-Nummer - 15),
# 0-15 als D0-D15; die Leitungsnummer steht im Tooltip ("41 (wire 56)").
# Umrechnung aus der Manual-Nummer:  FA-Nummer = Manual-Nummer + 15
#   (Manual  1..4 -> 16..19,  17..24 -> 32..39,  33..60 -> 48..75)
# Belegt durch Manuals/"Atari Schalterzuordnungen und Kontakttestcodes.csv"
# (Steckerpin J7/J10 + CPU-Adresse je Spiel) und durch das ROM: Airborne liest
# genau $2010-$2013, $2020-$2027, $2031-$204B, $204C, $204F.
# Die im Manual unbenannten Nummern 33/53/54/55 (= 48/68/69/70) werden nicht
# gelesen und bleiben deshalb ohne Namen.
# 76-79 = Hex-Decode-Schalter (Replay-Stufen, $204C-$204F).
#
# 0-15 sind KEINE Spielfeldschalter, sondern die beiden 8er-Programmier-DIP-
# Baenke der MPU (Handbuch: PROG SW1 und PROG SW2, Bauteile F2/F4). Sie haengen
# elektrisch wie gewoehnliche Schalter an derselben SWITCH-COMMON-Leitung und
# werden deshalb ueber dieselben Adressen gelesen. Zuordnung woertlich aus
# Table 5-6 (Memory Map) des Original-Manuals, Gegenprobe PinMAME dipg1_r
# (docs/atari.c) mit den Bitmasken S1/n, S2/n aus docs/atari.h:
#   0-3   $2000-$2003 = PROG SW2 Toggle 4, 3, 2, 1
#   4-7   $2004-$2007 = PROG SW2 Toggle 8, 7, 6, 5
#   8-11  $2008-$200B = PROG SW1 Toggle 4, 3, 2, 1
#   12-15 $200C-$200F = PROG SW1 Toggle 8, 7, 6, 5
# 11 ist doppelt belegt: PROG SW1 Toggle 1 und der Testschalter liegen im
# ORIGINAL auf derselben Dekoder-Leitung ($200B). Das Airborne-Handbuch sagt es
# selbst (Kapitel 1, E. SELF-TEST): "Toggle 1 of PROG SW1 on Processor PCB
# should always remain in off position. For bench test purposes, Self-Test mode
# may be activated by setting PROG SW1 toggle 1 to on then off. This simulates
# pressing the TEST pushbutton."
# Schalter 0: den Kontakt SW2-4 liest die Matrix, hier steht er also richtig --
# das SPIEL sieht ihn auf dem AtariFA aber nicht, dort liefert $2000 den
# synthetisierten DMA-Sync (AtariFA.vhd) statt des DIP-Werts.
# Die Funktionen in Klammern gelten fuer Airborne Avenger und stammen aus
# Manuals/Airborne Avenger/Atari_Inc_1977_Airborne_Avenger_Switch_Settings.txt.

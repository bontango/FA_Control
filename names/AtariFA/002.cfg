# FA_Control naming file -- Airborne Avenger on AtariFA
#
#
# See names/example.cfg for the full description of the format.
#
# Rules:
#   - plain text (UTF-8 is fine), one entry per line, at most 32 kB
#   - sections: [game] [lamps] [coils] [switches] [sounds] [displays]
#   - COIL numbers start at 1 (LISY convention, drivers Q1..Qn)
#     LAMPS, SWITCHES, SOUNDS and DISPLAYS start at 0
#     -- these are the numbers that go over the wire, not display offsets
#   - lines starting with # or ; are ignored, unknown numbers are ignored
#   - you only need the entries you care about; the rest stays numeric

[game]
name=Airborne Avenger
# shown on the home screen as: GAME 2 (AIRBORNE AVENGER)

[coils]
1=Left Flipper
2=Right Flipper
3=Left Slingshot
4=Right Slingshot
5=Left Bumper
6=Right Bumper
7=Knocker
8=Outhole
9=Ball Release
10=Drop Target Reset

[switches]
0=Left Outlane
1=Left Inlane
2=Right Inlane
3=Right Outlane
4=Left Slingshot
5=Right Slingshot
6=Left Bumper
7=Right Bumper
8=Outhole
9=Tilt
10=Slam Tilt
11=Credit Button
12=Coin Chute 1
13=Coin Chute 2

[lamps]
0=1x Bonus
1=2x Bonus
2=3x Bonus
3=Ball In Play
4=Game Over
5=Tilt
6=Match
7=High Score To Date
8=Shoot Again
9=Extra Ball

[sounds]
0=Silence
1=Bumper
2=Slingshot
3=Explosion
4=Bonus Count
5=Tilt

[displays]
0=Player 1
1=Player 2
2=Player 3
3=Player 4
4=Credits / Ball

# FA_Control naming file -- The Atarians on AtariFA
#
# Quellen:
#   Manuals/Atari Spulentreiberbelegung Gen1.pdf
#                                         Spulen Q1..Q20 (Blatt "THE ATARIANS")
#   Manuals/Atari Schalterzuordnungen und Kontakttestcodes.pdf
#                                         Schalter: Steckerpin + CPU-Adresse
#                                         ACHTUNG: die .csv daneben ist fuer die
#                                         Atarians verkuerzt -- ihr fehlt der
#                                         komplette Stecker J6. Hier gilt das PDF.
#   doc/Atarian_Operator_Options.jpg      Handbuch Table 1-2 "Operator Options"
#                                         (nennt die Optionen, aber KEINE Toggles)
#   Schaltplan (Nutzer, 09.2026)          vier DIP-Adressen $2000-$2003
#   doc/Lamp_Strobes_Atarians.png         Spielfeld-Lampenblatt (Pin -> Funktion)
#   FPGA_source/docs/FA_Control_Names_Files.md  Kochbuch (Umrechnung je Gewerk)
#   FPGA_source/docs/FA_Control_Interface.md    Kapitel 5 (Nummerierung)
#
# See names/example.cfg for the full description of the format.
#
# Rules:
#   - plain text (UTF-8 is fine), one entry per line, at most 32 kB
#   - sections: [game] [lamps] [coils] [switches] [sounds] [displays]
#   - COIL numbers start at 1 (LISY convention, drivers Q1..Qn)
#     LAMPS, SWITCHES, SOUNDS and DISPLAYS start at 0
#     -- these are the numbers that go over the wire, not display offsets
#   - lines starting with # or ; are ignored, unknown numbers are ignored
#   - you only need the entries you care about; the rest stays numeric
#   - KEIN Kommentar hinter dem Wert -- alles nach '=' ist der Name.

[game]
name=The Atarians
# shown on the home screen as: GAME 0 (THE ATARIANS)

[coils]
# FA-Control-Nummer = Treiber-Nummer Qn des Schaltplans (1..20),
# 21 = Muenzzaehler, 22 = Sperrspule Muenztuer (beide Aux-Board).
# Namen woertlich aus "Atari Spulentreiberbelegung Gen1.pdf".
# Q14 und Q18 sind auf der AtariFA-Platine gar nicht bestueckt und stehen
# folgerichtig bei keinem der fuenf Spiele in der PDF.
# Die Atarians sind das einzige der fuenf Spiele ohne Zaehlwerk auf Q20 --
# dort liegt der linke Flipper.

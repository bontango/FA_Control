[lamps]
# FA-Control-Nummer = (595-Gruppe - 1) * 4 + Strobe   (Strobe SA=0 .. SD=3)
# Die Zuordnung Steckerpin J1/J2 -> FA-Nummer ist SPIELUNABHAENGIG -- AtariFA hat
# genau ein Lampen-Layout fuer alle fuenf Spiele. Sie steht als fertige Tabelle in
# FPGA_source/docs/FA_Control_Names_Files.md Abschnitt 4 (erzeugt aus GRP_OF in
# rtl/common/lamp_map_pkg.vhd, gegen die 62 Airborne-Lampen der 002.cfg geprueft).
# Aus dem Lampenblatt dieses Spiels wurde deshalb nur "Pin -> Funktion" gelesen.
# Pin 1 und Pin A jedes Steckers tragen die Beleuchtung und sind nicht in der Matrix.
# Quelle: doc/Lamp_Strobes_Atarians.png (Spielfeld-Lampenblatt A006023-01).
# Gegenprobe: die DS-Nummern laufen auf dem Blatt lueckenlos in Steckerpin-
# Reihenfolge, DS10 an J1-2 bis DS79 an J2-J; die drei Spruenge sind genau die
# Beleuchtungsgruppen an J1-A, J2-1 und J2-A. Zweite Gegenprobe ueber die Strobes:
# die zehn Punktelampen 1,000..10,000 liegen alle auf Strobe SB, die fuenf
# ATARI-Buchstaben alle auf SD, die neun EXTRA-BALL-Buchstaben alle auf SC.
# Die Klammer-Ziffern (1)..(9) stehen so auf dem Blatt; was sie am Spielfeld
# bezeichnen, ist offen -- deshalb hier woertlich uebernommen.
# Bei den Spellouts markiert die Klammer den leuchtenden Buchstaben,
# wie in 002.cfg (dort A(i)rborne).
# 54 der 84 Lampen sind belegt. Nicht belegt: 0-3, 32-47, 69-70, 76-83

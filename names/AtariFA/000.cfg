[switches]
# FA-Control-Nummer = CPU-Offset (Adresse - 0x2000), 0-basiert.
# Das ist die Leitungs- und Schluesselnummer. FA Control BESCHRIFTET die
# Schalterkacheln bei AtariFA aber mit der Selbsttest-Nummer (= FA-Nummer - 15),
# 0-15 als D0-D15; die Leitungsnummer steht im Tooltip ("41 (wire 56)").
#
# Die Atarians weichen als einziges der fuenf Spiele deutlich ab: neben J7 und
# J10 gibt es einen dritten Stecker J6 mit EIGENEN Adressen ($2013-$201F und
# $2028-$202F). Diese Spalte steht nur im PDF, nicht in der CSV -- sie wurde
# am 09.2026 aus dem gerenderten PDF abgelesen.
#   J6:  $2013 Slam Tilt   $2014 Tilt Cabinet   $2015 Tiltpendel
#        $2016 Tilt Cabinet   $2017 ---   $2018-$201F SW #1..#8
#        $2028 Center Bumper  $2029/$202A Slingshots  $202B-$202F ATARI-Spellout
#   J7:  $2020-$2027 und $2030-$2034 (Rest unbelegt)
#   J10: $2010-$2013 Muenzen / Start / Slam
#   J7-S..V: $204C-$204F Hex-Decode-Schalter (Replay-Stufen)
# $2014 und $2016 sind im PDF BEIDE mit "Tilt Cabinet" beschriftet. So steht es
# in der Quelle; welcher der beiden Kontakte was ist, ist nicht geklaert.
#
# 0-15 sind KEINE Spielfeldschalter, sondern die beiden 8er-Programmier-DIP-
# Baenke der MPU (PROG SW1 und PROG SW2). Reihenfolge wie bei allen Gen1-
# Spielen (Memory Map Table 5-6, Gegenprobe PinMAME dipg1_r):
#   0-3   $2000-$2003 = PROG SW2 Toggle 4, 3, 2, 1
#   4-7   $2004-$2007 = PROG SW2 Toggle 8, 7, 6, 5
#   8-11  $2008-$200B = PROG SW1 Toggle 4, 3, 2, 1
#   12-15 $200C-$200F = PROG SW1 Toggle 8, 7, 6, 5
# Die Funktionen in Klammern kommen aus ZWEI Quellen -- der Unterschied ist
# wichtig, das Handbuch der Atarians ist an dieser Stelle unvollstaendig:
#
# BELEGT (Schaltplan, Adressen vom Nutzer 09.2026; Namen aus Table 1-2):
#   $2003 = 3 = SW2-1  Number of Balls (3/5)
#   $2002 = 2 = SW2-2  Match Score (no/yes)
#   $2001 = 1 = SW2-3  Replays Allowed (no/yes)
#   $2000 = 0 = SW2-4  Playfield Restoration (Schaltplan: Memory Reset/Restore)
# SW2-1 und SW2-2 liegen damit genauso wie bei allen vier anderen Spielen --
# die Atarians benutzen also dieselbe DIP-Bank-Aufteilung. SW2-3 und SW2-4
# weichen ab: dort liegt bei Airborne und Middle Earth der Muenz-/Credit-Block.
#
# UEBERNOMMEN von den anderen vier Spielen, wo es sich damit nicht beisst
# (4/5, 6/7, 14/15). Table 1-2 nennt genau drei weitere Optionen mit je vier
# Choices = je zwei Toggles, und es bleiben genau drei Toggle-Paare uebrig:
#   Selection of "Special"          -> SW2-7/8  (bei allen anderen Spielen gleich)
#   Game Cost                       -> SW2-5/6  (der Rest des Muenzblocks)
#   Maximum Allowable Game Credits  -> SW1-5/6  (bei allen anderen Spielen gleich)
# Das ist plausibel und in sich stimmig, aber fuer die Atarians nicht belegt.
#
# OHNE FUNKTION bleiben 8, 9, 10, 12 und 13: Table 1-2 kennt keine weitere
# Option. Bei den anderen Spielen liegen dort Replay-Stufe, Extra-Ball-Belohnung
# und Add-A-Ball -- Dinge, die die Atarians so nicht haben. Hier wird nichts
# geraten. Quelle waere Abschnitt 5.6 des Handbuchs, der im Scan fehlt.
#
# Schalter 0 ($2000): den DIP liest die Matrix richtig, das SPIEL sieht ihn auf
# dem AtariFA aber nur eingeschraenkt -- der FPGA ueberschreibt Bit 6 mit dem
# synthetisierten DMA-Sync (AtariFA.vhd).
# Schalter 11 traegt im Original zugleich den Testschalter. Die Atarians haben
# laut Handbuch keinen dokumentierten Selbsttest -- Table 1-2 kennt auch keinen
# Test-Toggle -- und reagieren am AtariFA nicht darauf (HW-Test 2026-07-06).
# Die Kachel bleibt also wirkungslos.
0=Prog SW2-4 (Playfield Restoration)

# FA_Control naming file -- Time 2000 on AtariFA
#
# Quellen:
#   Manuals/Atari Spulentreiberbelegung Gen1.pdf
#                                         Spulen Q1..Q20 (Blatt "TIME 2000")
#   Manuals/Atari Schalterzuordnungen und Kontakttestcodes.csv
#                                         Schalter: Steckerpin J7/J10 + CPU-Adresse
#   doc/Time2000_Operator_Options.jpg     Handbuch Kap. 1C, Table 2 (S. 10/11):
#                                         Funktion der Programmier-DIPs
#   doc/Lamp_Strobes_Time2000.png         Spielfeld-Lampenblatt (Pin -> Funktion)
#   Manuals/Time 2000/...TM-099...pdf S.66 Figure 31 (ungekuerzt, fuer J2)
#   FPGA_source/docs/FA_Control_Names_Files.md  Kochbuch (Umrechnung je Gewerk)
#   FPGA_source/docs/FA_Control_Interface.md    Kapitel 5 (Nummerierung)
#
# See names/example.cfg for the full description of the format.
#
# Rules:
#   - plain text (UTF-8 is fine), one entry per line, at most 32 kB
#   - sections: [game] [lamps] [coils] [switches] [sounds] [displays]
#   - COIL numbers start at 1 (LISY convention, drivers Q1..Qn)
#     LAMPS, SWITCHES, SOUNDS and DISPLAYS start at 0
#     -- these are the numbers that go over the wire, not display offsets
#   - lines starting with # or ; are ignored, unknown numbers are ignored
#   - you only need the entries you care about; the rest stays numeric
#   - KEIN Kommentar hinter dem Wert -- alles nach '=' ist der Name.

[game]
name=Time 2000
# shown on the home screen as: GAME 1 (TIME 2000)

[coils]
# FA-Control-Nummer = Treiber-Nummer Qn des Schaltplans (1..20),
# 21 = Muenzzaehler, 22 = Sperrspule Muenztuer (beide Aux-Board).
# Namen woertlich aus "Atari Spulentreiberbelegung Gen1.pdf".
# Q14 und Q18 sind auf der AtariFA-Platine gar nicht bestueckt und stehen
# folgerichtig bei keinem der fuenf Spiele in der PDF.
# Time 2000 hat vier Flipperspulen (Q6/Q11/Q13/Q16) und laut PDF kein
# Zaehlwerk auf Q20.
1=Upper Drop Target
2=Left Pop Bumper
3=Lower Drop Target
4=Center Hole Kicker
5=Out Hole Kicker
6=Right Center Flipper
7=Right Hole Kicker
8=Right Pop Bumper
9=NOT USED
10=NOT USED
11=Right Flipper Outside
12=Gate
13=Left Center Flipper
14=NOT USED
15=Left Slingshot
16=Left Flipper Outside
17=Right Slingshot
18=NOT USED
19=NOT USED
20=NOT USED
21=Coin Counter
22=Coin Lockout

[switches]
# FA-Control-Nummer = CPU-Offset (Adresse - 0x2000), 0-basiert.
# Das ist die Leitungs- und Schluesselnummer. FA Control BESCHRIFTET die
# Schalterkacheln bei AtariFA aber mit der Selbsttest-Nummer (= FA-Nummer - 15),
# 0-15 als D0-D15; die Leitungsnummer steht im Tooltip ("41 (wire 56)").
# Umrechnung aus der Manual-Nummer:  FA-Nummer = Manual-Nummer + 15
# Quelle: "Atari Schalterzuordnungen und Kontakttestcodes.csv", Spalte
# "Time 2000" (Steckerpin J7/J10 + CPU-Adresse). In der Quelle mit "---"
# gefuehrte Adressen sind bei diesem Spiel unbelegt und fehlen hier:
# 63-73 ($203F und $2040-$2049).
# 76-79 = Hex-Decode-Schalter (Replay-Stufen, $204C-$204F).
# Gegenprobe: der Outhole liegt auf $2035 = 53, so wie im FPGA-Top-Level
# (AtariFA.vhd, Trigger der Hintergrundmusik) hinterlegt.
#
# 0-15 sind KEINE Spielfeldschalter, sondern die beiden 8er-Programmier-DIP-
# Baenke der MPU (PROG SW1 und PROG SW2). Reihenfolge wie bei allen Gen1-
# Spielen (Memory Map Table 5-6, Gegenprobe PinMAME dipg1_r):
#   0-3   $2000-$2003 = PROG SW2 Toggle 4, 3, 2, 1
#   4-7   $2004-$2007 = PROG SW2 Toggle 8, 7, 6, 5
#   8-11  $2008-$200B = PROG SW1 Toggle 4, 3, 2, 1
#   12-15 $200C-$200F = PROG SW1 Toggle 8, 7, 6, 5
# Die Funktionen in Klammern stammen aus doc/Time2000_Operator_Options.jpg
# (Handbuch Kapitel 1C "Adjusting Operator Options", Table 2). Fuer Time 2000
# sind alle 16 Toggles dokumentiert -- als einziges der fuenf Spiele.
#
# Die Tabelle nennt die beiden DIP-Baenke nach ihrem BAUTEILORT F2 und F4, nicht
# nach PROG SW1 / SW2. Aufloesung ueber vier Anker, die alle in dieselbe Richtung
# zeigen: F2 Toggle 1 = Self Test (= PROG SW1-1, $200B), F2 Toggle 5+6 = Max
# Credits (= PROG SW1-5/6), F4 Toggle 1 = Balls per Game (= PROG SW2-1),
# F4 Toggle 2 = Match (= PROG SW2-2). Also F2 = PROG SW1, F4 = PROG SW2.
#
# Time 2000 ist das einzige der fuenf Spiele, das die beiden Muenzschaechte
# GETRENNT einstellt: linker Schacht auf SW1-2/3/4, rechter auf SW2-4/5/6.
# Ebenfalls nur hier: SW2-3 = Slam/Tilt Warning Sound.
# Die Replay-Stufen selbst haengen nicht an einem Toggle, sondern am REPLAY-
# Rotary-Schalter (Positionen 0-8) = Schalter 76-79 dieser Datei.
#
# Schalter 0 ($2000): den DIP liest die Matrix richtig, das SPIEL sieht ihn auf
# dem AtariFA aber nur eingeschraenkt -- der FPGA ueberschreibt Bit 6 mit dem
# synthetisierten DMA-Sync (AtariFA.vhd).
# Schalter 11 traegt im Original zugleich den Testschalter (dieselbe
# Dekoder-Leitung $200B wie PROG SW1 Toggle 1); das Handbuch fuehrt ihn als
# "Self Test Mode -- Location F2, 1 on".

[lamps]
# FA-Control-Nummer = (595-Gruppe - 1) * 4 + Strobe   (Strobe SA=0 .. SD=3)
# Die Zuordnung Steckerpin J1/J2 -> FA-Nummer ist SPIELUNABHAENGIG -- AtariFA hat
# genau ein Lampen-Layout fuer alle fuenf Spiele. Sie steht als fertige Tabelle in
# FPGA_source/docs/FA_Control_Names_Files.md Abschnitt 4 (erzeugt aus GRP_OF in
# rtl/common/lamp_map_pkg.vhd, gegen die 62 Airborne-Lampen der 002.cfg geprueft).
# Aus dem Lampenblatt dieses Spiels wurde deshalb nur "Pin -> Funktion" gelesen.
# Pin 1 und Pin A jedes Steckers tragen die Beleuchtung und sind nicht in der Matrix.
# Quelle: doc/Lamp_Strobes_Time2000.png; der unten angeschnittene J2-Block aus
# dem Original, Manuals/Time 2000/Time_2000_TM-099_1st_Printing.pdf Seite 66
# (Figure 31, Interconnect and Wiring Diagram, linkes Blatt).
# Dort ist auch geklaert, dass die letzte J2-Zeile (Triple Bonus) auf Pin J liegt
# und nicht auf F -- J2-F und J2-H sind unbelegt und im Blatt nicht gezeichnet.
# Gegenprobe: DS-Nummern lueckenlos in Pin-Reihenfolge (DS11 an J1-2 bis DS76 an
# J2-J, Spruenge = Beleuchtung). Zweite Gegenprobe ueber die Strobes: alle zwoelf
# AM-Lampen der Uhr liegen auf Strobe SA, alle zwoelf PM-Lampen auf SB, die vier
# Spieler-Lampen auf SD.
# 47 der 84 Lampen sind belegt. Nicht belegt: 0-3, 32-47, 65-71, 74-83

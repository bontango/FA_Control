# FA_Control naming file -- Caveman on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 38 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Caveman (Gottlieb PV-810, System 80A) -- auch "Caveman (flipprojects)"
# Quelle: N:\Flipper\Gottlieb\System80A\PV810_Caveman\Caveman Manual.pdf
#   S. 36 Playboard Switch and Lamp Assignments, Solenoid Test (Step 17)
# Die Videoeinheit des Spiels ist hier nicht abgebildet.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Alien Star on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 34 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Alien Star (Gottlieb 689, System 80A)
# Quelle: N:\Flipper\Gottlieb\System80A\689_Alien Star\Gottlieb_1984_Alien_Star_Manual.PDF
#   S. 43 Playboard Switch and Lamp Assignments, S. 12 Solenoid Test (Step 17)
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Robo War on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 55 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Robo-War (Gottlieb 714, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\714_Robo War\Gottlieb_1988_Robo-War_Manual.pdf
#   S. 48 Playboard Switch and Lamp Assignments; Spulen aus "Anleitung ROBO-WAR.pdf"
#   Solenoid Test (Step 17; Sol. 9 dort nicht lesbar, Outhole wie bei allen 80B)
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


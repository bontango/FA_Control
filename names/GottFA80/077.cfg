# FA_Control naming file -- Volcano (Sound only) on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 13 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Volcano (Gottlieb 667, System 80) -- Speech und Sound only
# Quelle: N:\Flipper\Gottlieb\System80\667_Volcano\Gottlieb_Volcano_3.pdf S. 32
#   Playboard Switch and Lamp Assignments; GottliebVolcanoManual.pdf Note A
#   Solenoid Assignments. Shoot Again steht im Handbuch als "L1" (wie bei Mars),
#   der Treiber ist aber derselbe wie L3 der anderen Spiele -- hier als 3.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


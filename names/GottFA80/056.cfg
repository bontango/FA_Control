# FA_Control naming file -- Excalibur on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 56 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Excalibur (Gottlieb 715, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\715_Excalibur\Gottlieb_1988_Excalibur_Manual.pdf
#   S. 48 Playboard Switch and Lamp Assignments mit Fussnoten, Solenoid Test (Step 17)
# Lampe 2 schaltet den Ball Release, Lampe 12 das Relais "S". Spulen 1..7 sind
# ueber Relais "S" doppelt belegt: S an = Spule, S aus = Blitzlampen (#67).
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


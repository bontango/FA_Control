# FA_Control naming file -- Krull on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 24 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Krull (Gottlieb 676, System 80A, Prototyp)
# Quelle: N:\Flipper\Gottlieb\System80A\676_Krull\Gottlieb Krull.pdf
#   S. 4 Switch Matrix (Schaltplan, Kennzeichnung U = oberes, L = unteres Level).
#   Lampen- und Spulenblatt (S. 5) im Scan unleserlich -- offen.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.

[game]
name=Krull

[lamps]
0=Game Over Relay
1=Tilt Relay
2=Coin Lockout

[switches]
0=#1 Drop Target (Upper)
1=R.O. Drop Target (Upper)
2=Hole (Upper)
3=#1 Spot Target (Lower)
7=Test Switch
10=#2 Drop Target (Upper)
11=Left Rollover (Upper)
13=#2 Spot Target (Lower)
14=Right Hole (Lower)
17=Left Coin Switch
20=#3 Drop Target (Upper)
21=Right Rollover (Upper)
23=#3 Spot Target (Lower)
24=Left Shooter (Lower)
27=Right Coin Switch
30=#4 Drop Target (Upper)
31=Rollunder (Upper)
32=Roundabout (Lower)
33=Rollunder (Lower)
34=Right Shooter (Lower)
37=Center Coin Switch
40=#1 Spot Target
41=#4 Spot Target
42=Pop Bumpers
43=Right Return Rollover
44=Left Shooter
45=Left Return Rollover
47=Replay Button
50=#2 Spot Target
51=#5 Spot Target
52=10 Point
53=Right Outside Rollover
54=Left Hole
55=Left Outside Rollover
57=Tilt
60=#3 Spot Target
62=Left Side Rollover
63=Right Rollover Drop Target
64=Right Hole
65=Left Rollover Drop Target
67=Outhole

[displays]
# LISY-Konvention: 0 = Status, 1..4 = Spieler 1..4.
0=Credits / Ball (Status)
1=Player 1
2=Player 2
3=Player 3
4=Player 4

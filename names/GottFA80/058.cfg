# FA_Control naming file -- Big House on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 58 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Big House (Gottlieb 713, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\713_Big House\Gottlieb_1989_Big_House_Instruction_Manual_...pdf
#   S. 52 Playboard Switch and Lamp Assignments (mit Fussnote: welche Lampen-
#   ausgaenge Relais/Spulen schalten), Solenoid Test (Step 17)
# Lampe 2 schaltet hier den Ball Release (statt Muenzsperre). SW 35 ist im
# Handbuch zweimal vergeben (Left / Right Flipper).
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Rock Encore on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 45 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Rock (Gottlieb 697, System 80B) -- auch fuer Rock Encore (704, gleiches Spielfeld)
# Quelle: N:\Flipper\Gottlieb\System80B\697_Rock\Gottlieb_1985_Rock_Manual.pdf
#   S. 48 Playboard Switch and Lamp Assignments, Solenoid Test (Step 17)
# Lampen 26..40 = Schriftzug ROCK AND ROLL LIVES!
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


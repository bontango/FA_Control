# FA_Control naming file -- Rack 'Em Up! on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 30 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Rack 'Em Up! (Gottlieb 685, System 80A)
# Quelle: N:\Flipper\Gottlieb\System80A\685_Rack 'Em Up!\Gottlieb_1983_Rack_Em_Up_Instruction_Manual_...pdf
#   S. 43 Playboard Switch and Lamp Assignments, S. 13 Solenoid Test (Step 17)
# Lampe 18 = #7, 19 = #9 (die #8 liegt auf Lampe 41 "#8 Shooter") -- so im Handbuch.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


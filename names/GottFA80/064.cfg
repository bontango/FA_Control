# FA_Control naming file -- Panthera on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 0 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Panthera (Gottlieb 652, System 80)
# Quelle: N:\Flipper\Gottlieb\System80\652_Panthera\Panthera.pdf
#   S. 10 Switch Matrix and Lamp Location Assignment, S. 9 Solenoid Assignments.
#   Lampen gegengeprueft mit LISY80 000_lisy80_lamps.csv (deckungsgleich, dort
#   lesbarer als im Scan).
# Lampen 4..7 und 10/11 sitzen im Lichtkasten.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Striker on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 23 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Striker (Gottlieb 675, System 80A)
# Quelle: N:\Flipper\Gottlieb\System80A\675_Striker\Gottlieb+Striker_Manual.pdf
#   S. 85 Playboard Switch and Lamp Assignments; Spulen aus
#   Gottlieb_1982_Striker_Instruction_Manual_...pdf S. 13 Solenoid Test (Step 17)
# Druckfehler im Handbuch: Lampen stehen dort als L21 "Right Defense #1" und
# L22 "Top Right Pop Bumper" -- nach der Reihenfolge L23 und L24 (so uebernommen).
# Das Handbuch nennt Tilt = 56; bei allen anderen Spielen ist es 57 -- hier
# nicht uebernommen, 57 kommt aus den Systemteilen. Offen, am Geraet pruefen.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Monte Carlo on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 49 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Monte Carlo (Gottlieb 708, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\708_Monte Carlo\Gottlieb_Monte-Carlo_Manual.pdf
#   S. 48 Playboard Switch and Lamp Assignments, Spulentest Testschritt 17
#   (deutsch, uebersetzt). Gegenprobe LISY80 049_lisy80_{lamps,switches}.csv:
#   deckungsgleich; Schalter 06/16 (Advance Buttons) stehen nur dort.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


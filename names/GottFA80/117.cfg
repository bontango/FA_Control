# FA_Control naming file -- Diamond Lady on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 53 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Diamond Lady (Gottlieb 711, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\711_Diamond Lady\Diamond_Lady_4.pdf S. 48
#   Playboard Switch and Lamp Assignments; Diamond_Lady_2.pdf Solenoid Test (Step 17)
# Lampe 4 = Sound 16 (80B). Lampen 21..27 = JACKPOT auf der Glasleiste.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Night Moves on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 61 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Night Moves (International Concepts C-103, Gottlieb System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\_Night Moves\Gottlieb_1989_Night_Moves_Instruction_Manual_...pdf
#   S. 52 Playboard Switch and Lamp Assignments mit Fussnote, Solenoid Test (Step 17)
# Lampe 2 schaltet das Multi-Ball Release, Lampe 4 = Sound 16.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


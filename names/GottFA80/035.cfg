# FA_Control naming file -- The Games on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 35 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# The Games (Gottlieb 691, System 80A)
# Quelle: N:\Flipper\Gottlieb\System80A\691_The Games\thegames.pdf
#   S. 13 Solenoid Test (Step 17). Die Schaltplanseiten (Switch Matrix S. 35,
#   Illumination S. 36) fehlen im Scan -- Lampen und Schalter deshalb offen.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.

[game]
name=The Games

[lamps]
0=Game Over Relay
1=Tilt Relay
2=Coin Lockout

[coils]
1=Hole
8=Knocker
9=Outhole

[switches]
7=Test Switch
17=Left Coin Switch
27=Right Coin Switch
37=Center Coin Switch
47=Replay Button
57=Tilt

[displays]
# LISY-Konvention: 0 = Status, 1..4 = Spieler 1..4.
0=Credits / Ball (Status)
1=Player 1
2=Player 2
3=Player 3
4=Player 4

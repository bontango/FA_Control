# FA_Control naming file -- Bone Busters Inc. on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 60 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Bone Busters Inc. (Gottlieb 719, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\719_Bone Busters\Gottleib_Bone-Busters_Manual.pdf
#   S. 52 Playboard Switch and Lamp Assignments mit Fussnoten. Die Selbsttest-Seite
#   fehlt im Scan: Spulen nur aus der Relais-"S"-Tabelle (1,2,3,5,6); 8 = Knocker
#   und 9 = Outhole wie bei allen 80B-Spielen (hier nicht belegt).
# Zuordnung der "S on"-Spalte zu Spule 3/6 im Scan nicht eindeutig.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


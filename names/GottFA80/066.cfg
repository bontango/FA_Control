# FA_Control naming file -- Circus on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 2 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Circus (Gottlieb 654, System 80)
# Quelle: N:\Flipper\Gottlieb\System80\654_Circus\Circus.pdf
#   S. 8 Switch Matrix and Lamp Location, S. 7 Solenoid Assignments (Step 17)
# Roto-Targets: je fuenf Schalter 42..46, 52..56, 62..66 (Handbuch: Bereich).
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


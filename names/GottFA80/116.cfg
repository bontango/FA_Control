# FA_Control naming file -- Victory on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 52 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Victory (Gottlieb 710, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\710_Victory\Victor Manual.pdf
#   S. 48 Playboard Switch and Lamp Assignments (Scan schwach, Lampen dort in
#   Grossbuchstaben), Solenoid Test (Step 17)
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


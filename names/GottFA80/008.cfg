# FA_Control naming file -- Force II on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 8 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Force II (Gottlieb 661, System 80)
# Quelle: N:\Flipper\Gottlieb\System80\661_ForceII\Force-II_Manual.pdf
#   S. 7 Switch Matrix and Lamp Location, S. 6 Solenoid Assignments (Step 17)
# Lampen 15..28 und 50 tragen je zwei bis drei Lampen (A/B/C) -- zusammengefasst.
# Spule 1 ist hier der Outhole-Kicker, Spule 9 der Trough.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


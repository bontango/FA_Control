# Eclipse (Gottlieb 671, System 80)
# Quelle: N:\Flipper\Gottlieb\System80\671_Eclipse\Eclipse_Manual.pdf
#   S. 4/5 Game Play and Scoring (Schalterliste). Lampen- und Spulenzuordnung
#   sind im Scan nicht lesbar -- offen.

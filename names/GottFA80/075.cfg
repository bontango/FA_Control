# FA_Control naming file -- Mars - God of War (Sound only) on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 11 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Mars - God of War (Gottlieb 666, System 80) -- Speech und Sound only
# Quelle: N:\Flipper\Gottlieb\System80\666_MarsGodofWar\Mars_Manual_2_of_2.pdf
#   S. 32 Playboard Switch and Lamp Assignments, S. 34 Playboard "Controlled"
#   Solenoids. Das Selbsttest-Kapitel fehlt im Scan; Spule 8 = Knocker aus dem
#   Kabinett-Schaltplan. Shoot Again steht im Handbuch als "L1", liegt im
#   Schaltplan aber an A3J3-C wie L3 bei allen anderen Spielen -- hier als 3.
# Gegenprobe Schalter: LISY80 010_lisy80_switches.csv (deckungsgleich).
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.

[game]
name=Mars - God of War (Sound only)


# FA_Control naming file -- Gold Wings on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 48 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Gold Wings (Gottlieb 707, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\707_Gold Wings\Goldwings German.pdf
#   S. 48 Playboard Switch and Lamp Assignments (englisch), Spulentest
#   Testschritt 17 (deutsch, hier uebersetzt: Loch-Kicker, Vertikale
#   Looping-Lampen, Obere linke/rechte Haube, Klopfer, Auslaufloch)
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


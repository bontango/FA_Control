# FA_Control naming file -- Spiderman on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 1 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# The Amazing Spider-Man (Gottlieb 653, System 80)
# Quelle: N:\Flipper\Gottlieb\System80\653_Spiderman\Amazing_Spiderman.pdf
#   S. 6 Switch Matrix and Lamp Location Assignment, Solenoid Assignments (Step 17)
# Die LISY80-Datei 001 weicht in den Lampentexten ab (andere Quelle) -- hier gilt
# das Handbuch.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


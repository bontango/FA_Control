# FA_Control naming file -- Hollywood Heat on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 46 (S1 game select), SD image list v402
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Hollywood Heat (Gottlieb 703, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\703_Hollywood Heat\Gottlieb_1985_Hollywood_Heat_Manual.pdf
#   S. 46 Playboard Switch and Lamp Assignments, Solenoid Test (Step 17)
# L13..L16 treiben laut Handbuch die Hilfstransistoren Q1..Q4. L23 ist im Handbuch
# zweimal vergeben (#4 Spot Target und Left Side Rollover) -- beide genannt.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- Hot Shots on GottFA80
#
# ERZEUGT von names/tools/gen_gottfa80_names.py -- nicht von Hand aendern.
# GottFA80 game 59 (S1 game select), SD image list v402, FREEPLAY on (S2-1, number + 64)
# Gilt fuer GottFA80, GottFA80S und GottFA80 PLuS (HW_NAME 'GottFA80').
#
# Hot Shots (Gottlieb 718, System 80B)
# Quelle: N:\Flipper\Gottlieb\System80B\718_Hot Shots\Slides_51_59.pdf S. 52
#   Playboard Switch and Lamp Assignments mit Fussnote. Die Selbsttest-Seite fehlt
#   im Scan: Spule 8 = Knocker aus dem Kabinett-Schaltplan, Spule 9 = Outhole wie
#   bei allen 80B-Spielen (nicht belegt), Spule 3 unbekannt.
# Lampe 2 = Ball Release, 12 = Relais "S", 13/14 = Rollover Bank Trip, 15 = Bottom
# Left Shooter. Spulen 1,2,4..7 haengen am Relais "S" (S aus = Spule, S an = Blitz).
# Die Buchstabenlampen 32..40 stehen im Handbuch in dieser Reihenfolge.
# Nummern = Gottlieb-Handbuch = LISY80: Lampe 0..47 (48..51 = invertiert 44..47),
# Spule 1..9, Schalter Strobe*10+Return. See names/example.cfg for the format.
# Kein Kommentar hinter dem Wert.


# FA_Control naming file -- example / template
#
# THIS FILE IS NEVER SELECTED AUTOMATICALLY: its name is not a machine ID.
# Copy it, rename it, fill it in.
#
# The file name IS the machine ID plus ".cfg":
#
#     <HARDWARE>_<GAME>.cfg        e.g.  AtariFA_002.cfg
#
# HARDWARE is what the board reports on LISY opcode 0x00 (the HW_NAME generic of
# the fa_control VHDL module -- "AtariFA", "GottFA1", ...), GAME is opcode 0x08,
# padded to three digits. FA_Control shows the exact ID in menu 07 NAMES once
# you have connected -- read it there instead of guessing. Upper and lower case
# do not matter. The game number alone would not do: it restarts at 0 on every
# board, so "002" means different machines on AtariFA and GottFA1.
#
# On AtariFA the game number is the game select DIP bank, 0..7:
#   0 The Atarians   1 Time 2000   2 Airborne Avenger
#   3 Middle Earth   4 Space Riders   (5..7 play Middle Earth)
# So Space Riders on AtariFA is "AtariFA_004.cfg". The ID carries no readable
# name -- that is what [game] name= below is for; FA_Control shows it next to
# the game number on the home screen.
#
# Upload the file in menu 07 NAMES, or place it on
# https://lisy.dev/swrep/misc/FA_Control/names/ and load it from there.
#
# Rules:
#   - plain text (UTF-8 is fine), one entry per line, at most 32 kB
#   - sections: [game] [lamps] [coils] [switches] [sounds] [displays]
#   - COIL numbers start at 1 (LISY convention, drivers Q1..Qn)
#     LAMPS, SWITCHES, SOUNDS and DISPLAYS start at 0
#     -- these are the numbers that go over the wire, not display offsets
#   - lines starting with # or ; are ignored, unknown numbers are ignored
#   - you only need the entries you care about; the rest stays numeric

[game]
name=Example Machine
# shown on the home screen as: GAME 2 (EXAMPLE MACHINE)

[coils]
1=Left Flipper
2=Right Flipper
3=Left Slingshot
4=Right Slingshot
5=Left Bumper
6=Right Bumper
7=Knocker
8=Outhole
9=Ball Release
10=Drop Target Reset

[switches]
0=Left Outlane
1=Left Inlane
2=Right Inlane
3=Right Outlane
4=Left Slingshot
5=Right Slingshot
6=Left Bumper
7=Right Bumper
8=Outhole
9=Tilt
10=Slam Tilt
11=Credit Button
12=Coin Chute 1
13=Coin Chute 2

[lamps]
0=1x Bonus
1=2x Bonus
2=3x Bonus
3=Ball In Play
4=Game Over
5=Tilt
6=Match
7=High Score To Date
8=Shoot Again
9=Extra Ball

[sounds]
0=Silence
1=Bumper
2=Slingshot
3=Explosion
4=Bonus Count
5=Tilt

[displays]
0=Player 1
1=Player 2
2=Player 3
3=Player 4
4=Credits / Ball
